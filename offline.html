<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0c0500" />
    <title>Offline · Satish Jhanwer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0500;
        --text-page: #f5ede0;
        --text-body: #c8b09c;
        --text-muted: #c8a882;
        --accent: #e8843a;
        --accent-dim: #d4692a;
        --cyan: #38bdf8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
        color: var(--text-body);
        background:
          radial-gradient(circle at 20% 10%, rgba(232, 132, 58, 0.12), transparent 50%),
          radial-gradient(circle at 80% 90%, rgba(56, 189, 248, 0.08), transparent 45%),
          var(--bg);
      }

      main {
        width: min(460px, 100%);
        text-align: center;
      }

      .logo {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--accent);
      }

      .logo span {
        color: var(--cyan);
      }

      h1 {
        margin: 20px 0 10px;
        font-size: clamp(28px, 6vw, 38px);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
        color: var(--text-page);
      }

      p {
        font-size: 16px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin: 28px 0 20px;
      }

      button,
      a.secondary {
        min-height: 44px;
        padding: 12px 24px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
      }

      button {
        color: var(--bg);
        background: linear-gradient(135deg, var(--accent-dim), var(--accent));
        border: none;
      }

      a.secondary {
        display: inline-flex;
        align-items: center;
        color: var(--text-page);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      .note {
        font-size: 14px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">SJ<span>_</span></div>
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved for offline use yet. Reconnect and try
        again — once you've visited it online, it will open offline too.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a class="secondary" href="/">Go to the home page</a>
      </div>
      <p class="note">
        Want to get in touch? Email
        <a href="mailto:satish.jhanwer@gmail.com" style="color: var(--cyan)"
          >satish.jhanwer@gmail.com</a
        >
      </p>
    </main>
  </body>
</html>
